<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Avenir Next','Nunito Sans',system-ui,sans-serif;background:#1a1a1a;color:#e0e0e0;-webkit-font-smoothing:antialiased}
  body{background-image:radial-gradient(900px 500px at 30% 0%, rgba(178,34,34,.12), transparent 60%), radial-gradient(700px 400px at 80% 100%, rgba(192,192,192,.06), transparent 60%);background-attachment:fixed}
  .gate{min-height:100vh;display:grid;place-items:center;padding:32px 20px}
  .card{max-width:480px;width:100%;background:linear-gradient(135deg,#3a3a3a 0%, #1a1a1a 50%, #2F2F2F 100%);border:1px solid #8a8a8a;box-shadow:8px 8px 0 rgba(0,0,0,.55);padding:38px 34px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#B22222}
  .eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.2em;color:#d83333;font-weight:800;margin-bottom:14px}
  h1{font-family:'Anton','Avenir Next',sans-serif;font-weight:400;font-size:clamp(2rem,4.5vw,2.8rem);line-height:1.04;margin-bottom:8px;letter-spacing:.02em;text-transform:uppercase;color:#fff}
  h1 em{color:#d83333;font-style:normal;display:inline-block;position:relative}
  h1 em::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:#B22222;transform:skewX(-10deg)}
  p.sub{color:#C0C0C0;font-size:.96rem;margin-bottom:24px;line-height:1.5}
  label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:#9a9a9a;font-weight:700;margin-bottom:6px}
  .row{display:flex;gap:8px}
  input[type=password]{flex:1;border:1px solid #8a8a8a;background:#0a0a0a;color:#fff;padding:12px 14px;font-family:inherit;font-size:1rem;outline:none}
  input[type=password]:focus{box-shadow:3px 3px 0 #B22222;border-color:#B22222}
  button{font-family:'Anton',sans-serif;letter-spacing:.06em;background:#B22222;color:#fff;border:1px solid #B22222;padding:0 20px;font-size:1rem;cursor:pointer;text-transform:uppercase;transition:transform .08s ease}
  button:hover{background:#d83333;border-color:#d83333}
  button:active{transform:translate(1px,1px)}
  .err{color:#d83333;font-size:.85rem;margin-top:10px;min-height:1.2em;font-weight:600}
  .foot{margin-top:26px;padding-top:18px;border-top:1px dashed #3a3a3a;font-size:.72rem;color:#9a9a9a;line-height:1.5}
  .foot strong{color:#fff}
  .loading{opacity:.55;pointer-events:none}
</style>
</head>

async function decrypt(pwd){
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64(BLOB.s), iterations: BLOB.n, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(BLOB.i) }, key, b64(BLOB.p));
  return dec.decode(plain);
}

    card.classList.remove('loading');
    btn.textContent = 'Entra';
    errEl.textContent = 'Password non corretta. Riprova.';
    document.getElementById('pwd').select();
  }
});
</script>
