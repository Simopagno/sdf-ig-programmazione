  input[type=password]{flex:1;border:1.5px solid #181614;background:#fff;padding:12px 14px;font-family:inherit;font-size:1rem;outline:none}
  input[type=password]:focus{box-shadow:3px 3px 0 #a64a2e;border-color:#a64a2e}

  button:hover{background:#a64a2e;border-color:#a64a2e}
  button:active{transform:translate(1px,1px)}
  .err{color:#a64a2e;font-size:.85rem;margin-top:10px;min-height:1.2em;font-weight:500}
  .foot{margin-top:24px;padding-top:16px;border-top:1px dashed #d9cfbe;font-size:.72rem;color:#8a7e72;line-height:1.5}
  .foot strong{color:#181614}
  .loading{opacity:.55;pointer-events:none}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pwd){
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64(BLOB.s), iterations: BLOB.n, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(BLOB.i) }, key, b64(BLOB.p));
  return dec.decode(plain);
}
const form = document.getElementById('f');
const errEl = document.getElementById('err');
const card = document.getElementById('card');
const btn = document.getElementById('btn');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  card.classList.add('loading');
  btn.textContent = 'Decifro...';
  try {
    const html = await decrypt(document.getElementById('pwd').value);
    document.open();
    document.write(html);
    document.close();
  } catch(err) {
    card.classList.remove('loading');
    btn.textContent = 'Entra';
    errEl.textContent = 'Password non corretta. Riprova.';
    document.getElementById('pwd').select();
  }
});
